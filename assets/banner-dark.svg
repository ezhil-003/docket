<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Docket — Markdown to Executive PDF</title>
  <desc id="desc">A terminal-inspired Docket wordmark with a document-to-PDF tagline.</desc>
  <rect width="1200" height="320" rx="28" fill="#272a31"/>
  <rect x="34" y="34" width="1132" height="252" rx="18" fill="#2d3139" stroke="#454b57" stroke-width="2"/>
  <circle cx="72" cy="72" r="8" fill="#a78bfa"/><circle cx="101" cy="72" r="8" fill="#8b5cf6"/><circle cx="130" cy="72" r="8" fill="#6d28d9"/>
  <text x="600" y="158" text-anchor="middle" fill="#f4f4f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="78" font-weight="700" letter-spacing="18">DOCKET</text>
  <text x="600" y="215" text-anchor="middle" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" letter-spacing="3">MARKDOWN → EXECUTIVE PDF ENGINE</text>
