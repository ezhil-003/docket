<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Docket — Markdown to Executive PDF</title>
  <desc id="desc">A terminal-inspired Docket wordmark with a document-to-PDF tagline.</desc>
  <rect width="1200" height="320" rx="28" fill="#f7f7f8"/>
  <rect x="34" y="34" width="1132" height="252" rx="18" fill="#ffffff" stroke="#d4d4d8" stroke-width="2"/>
  <circle cx="72" cy="72" r="8" fill="#a78bfa"/><circle cx="101" cy="72" r="8" fill="#c4b5fd"/><circle cx="130" cy="72" r="8" fill="#ddd6fe"/>
  <text x="600" y="158" text-anchor="middle" fill="#27272a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="78" font-weight="700" letter-spacing="18">DOCKET</text>
  <text x="600" y="215" text-anchor="middle" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" letter-spacing="3">MARKDOWN → EXECUTIVE PDF ENGINE</text>
</svg>
