name: Release Docket

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            extension: ""
          - os: macos-13
            target: darwin-x64
            extension: ""
          - os: macos-14
            target: darwin-arm64
            extension: ""
          - os: windows-latest
            target: windows-x64
            extension: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build release binary
        shell: bash
        run: bun build --compile src/cli.ts --outfile "docket-${{ matrix.target }}${{ matrix.extension }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docket-${{ matrix.target }}
          path: docket-${{ matrix.target }}${{ matrix.extension }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: docket-*
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum docket-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
